name: Deploy Konata Web

on:
  push:
    branches: [master, stable]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Pagesはdeployごとに全体を置き換えるため、常に両branchを同じartifactへまとめる。
      - name: Checkout unstable branch
        uses: actions/checkout@v6
        with:
          ref: master
          path: unstable

      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: stable
          path: stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            unstable/package-lock.json
            stable/package-lock.json

      - name: Install unstable dependencies
        working-directory: unstable
        run: npm ci

      # Electronはsandboxed Chromiumのテスト実行器としてだけ使い、配布物には含めない。
      # Pagesへ未検証の生成物を出さないよう、既存のMakeターゲットをそのまま使う。
      - name: Verify and package latest app
        working-directory: unstable
        run: make latest-archive

      - name: Install stable dependencies
        working-directory: stable
        run: npm ci

      - name: Verify and build stable app
        working-directory: stable
        run: |
          make typecheck
          make test
          make production-smoke

      # masterのHTML、latest ZIP、demo traceをrootへ置き、release版だけをstable/へ分ける。
      - name: Assemble GitHub Pages site
        run: |
          mkdir -p dist-site/stable
          cp unstable/dist-web/index.html dist-site/index.html
          cp unstable/dist-release/konata-latest.zip dist-site/konata-latest.zip
          cp unstable/docs/kanata-sample-2.log.gz dist-site/trace1
          cp stable/dist-web/index.html dist-site/stable/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
